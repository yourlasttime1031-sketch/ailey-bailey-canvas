name: Personal constitution GPT builder package

on:
  push:
    branches:
      - docs/personal-constitution-gpt-builder-package
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate builder package
        run: node tests/validate-gpt-builder-package.mjs
